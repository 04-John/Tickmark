<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Tickmark · books for any NEAR DAO, checked against the chain</title>
    <meta name="description" content="Books and audit questions for any NEAR treasury, read straight from the chain." />
    <meta name="theme-color" content="#f5f5f2" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)" />
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14.5' fill='%231c2b45'/%3E%3Cpath d='M17 33.5Q22 37.5 27 44Q35 28.5 48 19' fill='none' stroke='%23ff5a47' stroke-width='9' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet" />
    <script>
      // Light or dark before the first paint: the visitor's own choice if they made one, else the system's.
      (function () {
        var theme = null;
        try {
          theme = localStorage.getItem('tickmark:theme');
        } catch (e) {}
        if (theme !== 'light' && theme !== 'dark') theme = matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
        document.documentElement.setAttribute('data-theme', theme);
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <noscript>Tickmark runs the books in your browser and needs JavaScript.</noscript>
    <script type="module" src="./src/main.tsx"></script>
  </body>
</html>
